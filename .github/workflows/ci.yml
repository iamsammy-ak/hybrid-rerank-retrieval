name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type-check
        # numpy's stubs differ between the releases pip picks for 3.10 and 3.12; type-check against the newest.
        if: matrix.python-version == '3.12'
        run: mypy
      - name: Test (real-model tests skip without a local model cache)
        run: pytest -q
