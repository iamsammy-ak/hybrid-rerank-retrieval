[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "hybrid-rerank-retrieval"
version = "0.1.0"
description = "Hybrid BM25 + dense retrieval with cross-encoder reranking, metadata filters and a latency/quality benchmark harness."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Abhishek Kumar" }]
keywords = ["information-retrieval", "bm25", "hybrid-search", "reranking", "embeddings", "beir"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
models = ["fastembed>=0.4"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
charts = ["matplotlib>=3.7"]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "matplotlib>=3.7",
]

[project.scripts]
hybrid-search = "hybrid_retrieval.cli:main"

[project.urls]
Repository = "https://github.com/iamsammy-ak/hybrid-rerank-retrieval"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_retrieval"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["models: needs the real fastembed models in the local cache (skipped otherwise)"]

[tool.mypy]
python_version = "3.10"
files = ["src/hybrid_retrieval"]
strict = true
warn_unused_ignores = true
warn_return_any = false

[[tool.mypy.overrides]]
module = ["fastembed.*", "scipy.*", "uvicorn.*", "matplotlib.*", "onnxruntime.*"]
ignore_missing_imports = true
